## Concurrent

--

```python
bigger_nums = Stream.range(10, 15).foreach(
    lambda i: print(f"Slower {i}")
)
longer_delays = Stream.fixed_delay(2)
```

--
```python
s1 = delays.zip(nums)
s2 = longer_delays.zip(bigger_nums)

s1.merge(s2)
```

--
```python

# Slower 10
# This is 2
# This is 3
# Slower 11
# This is 4

```

## Error-aware

--

```python
err = Stream.values("a", "b", "c").append(
    Stream.raise_error(Exception("oh noes!"))
)
```

--
```python
err
  .handle_error(lambda e: Stream.values(f"Got: {e}"))
  .foreach(print)
```
--

```python
# a
# b
# c
# Got: oh noes!

## Vacation Reports

---

A pipeline:
- For every vacation report
- Enrich the data
- Write to a database

---

```python
class VacationReport:
    name: str
    days: int
    sick_leave: bool

class Metadata:
    available_days: int

class Enriched:
    value: VacationReport
    metadata: Metadata
```

---

```python
class EmployeeAPI(ABC):
    async def enrich(
      self, 
      vacation: VacationReport) -> Enriched
```
--
```python
class DBWriter(ABC):
    async def write(self, value: Enriched) -> None

    async def write_all(
        self,
        values: Sequence[Enriched]) -> None
```
---

layout: true
## In Memory

---

```python
vacations: Stream[VacationReport] = Stream.values(
    VacationReport("Alice", 1, False),
    VacationReport("Bob", 2, True),
    VacationReport("Charlie", 1, False),
    VacationReport("David", 3, True),
)
```

--

```python
sickly: Stream[String] = (
  vacations
    .filter(is_sick)
    .map(report_name)
)
```
---

```python
flow: Stream[None] = (
  vacations
    .mapAsync(api.enrich)
    .mapAsync(db.write)
)
```

--

```txt
Getting available vacation days for Alice
Writing Enriched(VacationReport(Alice, 1, False), 4)
Getting available vacation days for Bob
Writing Enriched(VacationReport(Bob, 2, True), 1)
Getting available vacation days for Charlie
Writing Enriched(VacationReport(Charlie, 1, False), 6)
Getting available vacation days for David
Writing Enriched(VacationReport(David, 3, True), 2)
```

## Everyday I'm Refactoring

---

```python
Flow[Input, Output]
```

--

```python
def enrich_pipeline(
    api: EmployeeAPI) -> Flow[VacationReport, Enriched]:

    return flow(VacationReport).mapAsync(api.enrich)
{{content}}
```
--

def db_pipeline(db: DBWriter) -> Flow[Enriched, None]:

    return flow(Enriched).mapAsync(db.write)

--

```python
vacations
    .via(enrich_pipeline(api))
    .via(db_pipeline(db))
```

```python
start_lock = Lock()
next_start = loop.time()

async def enrich_one(report: VacationReport) -> Enriched:
    nonlocal next_start

    async with start_lock:
        now = loop.time()
        if next_start > now:
            await sleep(next_start - now)
        next_start = loop.time() + 0.05

    return await api.enrich(report)

pending: deque[Task[Enriched]] = deque()

with Path("vacations.csv").open() as file:
    eof = False
    while not eof or pending:
        while not eof and len(pending) < 10:
            line = file.readline()
            if line == "":
                eof = True
                break
            report = VacationReport.parse_csv(line)
            if report is None:
                continue
            pending.append(create_task(enrich_one(report)))

        if not pending:
            continue
        enriched = await pending.popleft()

        await db.write(enriched)

## Better DB Calls

---

```python
flow(Enriched)
    .mapAsync(db.write)
```

---

```python
flow(Enriched)
    .group_within(max_items=10, duration=1.0)
    .mapAsync(db.write_all)
```

---

```python
flow(Enriched)
    .group_within(max_items=10, duration=1.0)
    .mapAsync(db.write_all, concurrency=5)
```

---
```python
flow(Enriched)
    .group_within(max_items=10, duration=1.0)
    .mapAsyncUnordered(db.write_all, concurrency=5)
