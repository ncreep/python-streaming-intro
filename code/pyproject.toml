[project]
name = "python-streaming-intro"
version = "0.1.0"
description = "Python code for the streaming workshop"
requires-python = ">=3.15"
dependencies = ["aiostream>=0.8.1"]

[dependency-groups]
dev = [
    "aioitertools",
    "hypothesis>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff",
    "ty>=0.0.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workshop_stream"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
